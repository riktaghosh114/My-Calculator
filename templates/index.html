<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="calculator">

        <!-- Header -->
        <div class="header">

            <div>
                <h1>Calculator</h1>
                <p>Using Python</p>
            </div>

            <button
                id="angleMode"
                class="angle-button"
            >
                DEG
            </button>

        </div>


        <!-- Display -->
        <div class="display">

            <div
                id="expression"
                class="expression"
            >
                0
            </div>

            <div
                id="result"
                class="result"
            >
                0
            </div>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <!-- Scientific -->
            <button data-value="sin(">sin</button>
            <button data-value="cos(">cos</button>
            <button data-value="tan(">tan</button>
            <button data-value="log(">log</button>
            <button data-value="ln(">ln</button>

            <button data-value="asin(">sin⁻¹</button>
            <button data-value="acos(">cos⁻¹</button>
            <button data-value="atan(">tan⁻¹</button>
            <button data-value="sqrt(">√</button>
            <button data-value="^">xʸ</button>

            <button data-value="π">π</button>
            <button data-value="e">e</button>
            <button data-value="^2">x²</button>
            <button data-value="!">x!</button>
            <button data-value="%">%</button>


            <!-- Controls -->
            <button
                id="clear"
                class="danger"
            >
                AC
            </button>

            <button
                id="delete"
                class="danger"
            >
                DEL
            </button>

            <button data-value="(">
                (
            </button>

            <button data-value=")">
                )
            </button>

            <button
                data-value="÷"
                class="operator"
            >
                ÷
            </button>


            <!-- Numbers -->
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>

            <button
                data-value="×"
                class="operator"
            >
                ×
            </button>

            <button
                data-value="-"
                class="operator"
            >
                −
            </button>


            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>

            <button
                data-value="+"
                class="operator"
            >
                +
            </button>

            <button
                data-value="."
                class="operator"
            >
                .
            </button>


            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>

            <button
                data-value="00"
            >
                00
            </button>

            <button
                data-value="0"
            >
                0
            </button>


            <button
                id="equals"
                class="equals"
            >
                =
            </button>

        </div>


        <!-- History -->
        <div class="history-section">

            <div class="history-title">

                <h2>Calculation History</h2>

                <button id="clearHistory">
                    Clear
                </button>

            </div>

            <div id="history">

                <p class="empty-history">
                    No calculations yet
                </p>

            </div>

        </div>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
